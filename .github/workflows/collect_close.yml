name: 종가 히스토리 수집

on:
  schedule:
    # KST 15:40 (UTC 06:40), 장마감 직후, 평일만
    - cron: "40 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python collect_daily_close.py

      - name: price_history.json 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          git diff --cached --quiet || git commit -m "chore: 종가 히스토리 갱신 ($(date +%Y-%m-%d))"
          git push
