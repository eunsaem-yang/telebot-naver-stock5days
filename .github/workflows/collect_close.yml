name: 종가 히스토리 수집

on:
  schedule:
    # KST 15:45 (UTC 06:45), 장마감 직후, 평일만
    # 정시(0분)는 GitHub Actions 스케줄이 몰려 지연·스킵되기 쉬워 40분→45분으로 미룸
    - cron: "45 6 * * 1-5"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python collect_daily_close.py
